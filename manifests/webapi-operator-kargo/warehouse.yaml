apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: webapi-operator
  namespace: infrastructure
spec:
  subscriptions:
    - image:
        repoURL: ghcr.io/aaronstahley/webapi-operator
        semverConstraint: ">=0.1.0"
        discoveryLimit: 10
        allowTags: ^\d+\.\d+\.\d+$
