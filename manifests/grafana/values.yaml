# Grafana Helm Chart Values Override
# NOTE: For production use, replace plain text passwords with Sealed Secrets or external secret management

# Service configuration
service:
  type: NodePort
  port: 80

# Admin credentials (DEMO ONLY - use secrets management in production)
adminUser: admin
adminPassword: admin

# Persistence configuration
persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Datasources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources: []

# Sample dashboard configuration
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# Pre-configured dashboards
dashboards:
  default:
    kubernetes-cluster:
      gnetId: 7249
      revision: 1
      datasource: Prometheus

# Security context
securityContext:
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
