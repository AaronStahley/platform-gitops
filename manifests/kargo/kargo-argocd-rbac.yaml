apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kargo-argocd-updater
  namespace: argocd
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-argocd-updater-payments
  namespace: argocd
subjects:
- kind: ServiceAccount
  name: kargo-promoter
  namespace: payments
roleRef:
  kind: Role
  name: kargo-argocd-updater
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-argocd-updater-orders
  namespace: argocd
subjects:
- kind: ServiceAccount
  name: kargo-promoter
  namespace: orders
roleRef:
  kind: Role
  name: kargo-argocd-updater
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-argocd-updater-infrastructure
  namespace: argocd
subjects:
- kind: ServiceAccount
  name: kargo-promoter
  namespace: infrastructure
roleRef:
  kind: Role
  name: kargo-argocd-updater
  apiGroup: rbac.authorization.k8s.io
