apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: payments-project
  source:
    repoURL: https://github.com/AaronStahley/payments-gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true