apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: orders-project
  source:
    repoURL: https://github.com/AaronStahley/orders-gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # Note: This will show as "Missing" in ArgoCD until orders-gitops repo exists
