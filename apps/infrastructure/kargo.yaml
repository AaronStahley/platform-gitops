apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Multi-source pattern: Helm chart + values from Git
  sources:
    # Kargo Helm chart from OCI registry
    - repoURL: ghcr.io/akuity/kargo-charts
      chart: kargo
      targetRevision: 1.9.2
      helm:
        valueFiles:
          - $values/manifests/kargo/values.yaml

    # Values file from platform-gitops repository
    - repoURL: https://github.com/AaronStahley/platform-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kargo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
